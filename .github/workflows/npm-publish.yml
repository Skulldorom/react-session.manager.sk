# Releases triggered by a push only run after the separate Tests workflow succeeds.
# Manual releases invoke that same reusable test workflow before publishing.

name: Release

on:
  workflow_run:
    workflows:
      - Tests
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version increment type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  manual-tests:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tests.yml

  build-and-publish:
    needs: manual-tests
    # Skip push events triggered by the version-bump commit to avoid an infinite loop.
    # A workflow_run release requires a successful Tests workflow; a manual release
    # requires the reusable test job above to succeed.
    if: >-
      always() &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        !contains(github.event.workflow_run.head_commit.message, 'chore: bump version')) ||
       (github.event_name == 'workflow_dispatch' && needs.manual-tests.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Use a PAT or the default token; fetch full history for tagging
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run package smoke tests
        run: npm run test:smoke

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate release notes
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          else
            NOTES=$(git log --pretty=format:"- %s")
          fi
          if [ -z "$NOTES" ]; then
            NOTES="- Dependency updates and maintenance"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Use the chosen type on manual dispatch, default to patch on push
      - name: Bump version
        id: version
        run: |
          VERSION_TYPE="${{ github.event.inputs.version_type || 'patch' }}"
          npm version $VERSION_TYPE --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and tag version bump
        run: |
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}"
          git tag ${{ steps.version.outputs.tag }}
          git push origin HEAD:main --follow-tags

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Changes in this Release

            ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false

      # Publish to NPM
      - run: npm publish --provenance --access public
